services:
  tailor:
    image: ghcr.io/d1scolor/tailor:latest
    container_name: tailor
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./data:/data
    environment:
      INITIAL_USERNAME: "changeme"
      INITIAL_PASSWORD: "changeme"
      BASE_URL: "https://tailor.example.com"
      DEFAULT_LOCALE: "zh"
      CURRENCY_SYMBOL: "¥"
      NEXT_PUBLIC_CURRENCY_SYMBOL: "¥"
      MAX_UPLOAD_MB: "20"
      NODE_ENV: "production"
