services:
  tailor:
    image: "${TAILOR_IMAGE:-ghcr.io/d1scolor/tailor:latest}"
    build:
      context: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - tailor-data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    env_file:
      - .env

volumes:
  tailor-data:
