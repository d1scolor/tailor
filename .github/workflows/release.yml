name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable tag to publish or promote, for example v0.2.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - id: release
        name: Validate stable tag
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Stable tags must use vMAJOR.MINOR.PATCH, for example v0.2.0" >&2
            exit 1
          fi
          if [[ "$(git cat-file -t "refs/tags/${RELEASE_TAG}")" != "tag" ]]; then
            echo "$RELEASE_TAG must be an annotated Git tag" >&2
            exit 1
          fi
          git fetch origin main:refs/remotes/origin/main
          commit="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          if ! git merge-base --is-ancestor "$commit" origin/main; then
            echo "$RELEASE_TAG points to $commit, which is not part of origin/main" >&2
            exit 1
          fi
          version="${RELEASE_TAG#v}"
          series="${version%.*}"
          highest_tag="$(
            git tag --list "v*.*.*" |
              grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' |
              sort -V |
              tail -n 1
          )
          highest_series_tag="$(
            git tag --list "v${series}.*" |
              grep -E "^v${series//./\\.}\\.(0|[1-9][0-9]*)$" |
              sort -V |
              tail -n 1
          )

          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "series=$series" >> "$GITHUB_OUTPUT"
          if [[ "$RELEASE_TAG" == "$highest_series_tag" ]]; then
            echo "update_series=true" >> "$GITHUB_OUTPUT"
          else
            echo "update_series=false" >> "$GITHUB_OUTPUT"
          fi
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" || "$RELEASE_TAG" == "$highest_tag" ]]; then
            echo "update_latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "update_latest=false" >> "$GITHUB_OUTPUT"
          fi
      - id: image
        name: Resolve image name
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote the tested image
        env:
          COMMIT: ${{ steps.release.outputs.commit }}
          IMAGE: ${{ steps.image.outputs.name }}
          SERIES: ${{ steps.release.outputs.series }}
          UPDATE_LATEST: ${{ steps.release.outputs.update_latest }}
          UPDATE_SERIES: ${{ steps.release.outputs.update_series }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          source_ref="${IMAGE}:sha-${COMMIT}"
          version_ref="${IMAGE}:${VERSION}"
          if ! docker buildx imagetools inspect "$source_ref" >/dev/null 2>&1; then
            echo "No immutable image exists for $source_ref" >&2
            exit 1
          fi
          source_digest="$(
            docker buildx imagetools inspect "$source_ref" --format '{{json .Manifest}}' |
              jq -r '.digest'
          )"
          if [[ -z "$source_digest" || "$source_digest" == "null" ]]; then
            echo "No immutable image exists for $source_ref" >&2
            exit 1
          fi

          if docker buildx imagetools inspect "$version_ref" >/dev/null 2>&1; then
            version_digest="$(
              docker buildx imagetools inspect "$version_ref" --format '{{json .Manifest}}' |
                jq -r '.digest'
            )"
            if [[ "$version_digest" != "$source_digest" ]]; then
              echo "$version_ref already points to a different image and will not be overwritten" >&2
              exit 1
            fi
          fi

          target_tags=(--tag "$version_ref")
          if [[ "$UPDATE_SERIES" == "true" ]]; then
            target_tags+=(--tag "${IMAGE}:${SERIES}")
          fi
          if [[ "$UPDATE_LATEST" == "true" ]]; then
            target_tags+=(--tag "${IMAGE}:latest")
          fi
          docker buildx imagetools create "${target_tags[@]}" "${IMAGE}@${source_digest}"
      - name: Create or promote the GitHub Release
        env:
          UPDATE_LATEST: ${{ steps.release.outputs.update_latest }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            if [[ "$UPDATE_LATEST" == "true" ]]; then
              gh release edit "$RELEASE_TAG" --latest
            fi
          else
            latest_flag="--latest=false"
            if [[ "$UPDATE_LATEST" == "true" ]]; then
              latest_flag="--latest"
            fi
            gh release create "$RELEASE_TAG" \
              --verify-tag \
              --generate-notes \
              "$latest_flag" \
              --title "Tailor ${VERSION}"
          fi
