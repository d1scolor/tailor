name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high

  publish-sha:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ${{ steps.image.outputs.name }}
    steps:
      - uses: actions/checkout@v7
      - id: image
        name: Resolve image name
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: type=raw,value=sha-${{ github.sha }}
          labels: org.opencontainers.image.licenses=AGPL-3.0-only
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=tailor-container
          cache-to: type=gha,mode=max,scope=tailor-container
      - if: github.event.repository.private == false
        name: Publish GitHub build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  promote-edge:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: publish-sha
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: tailor-edge-promotion
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - id: current
        name: Check whether this is still the tip of main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$current_sha" == "$GITHUB_SHA" ]]; then
            echo "promote=true" >> "$GITHUB_OUTPUT"
          else
            echo "promote=false" >> "$GITHUB_OUTPUT"
            echo "main has advanced to $current_sha; the immutable SHA image remains available"
          fi
      - if: steps.current.outputs.promote == 'true'
        uses: docker/setup-buildx-action@v4
      - if: steps.current.outputs.promote == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.current.outputs.promote == 'true'
        name: Move edge to this image
        env:
          DIGEST: ${{ needs.publish-sha.outputs.digest }}
          IMAGE: ${{ needs.publish-sha.outputs.image }}
        run: docker buildx imagetools create --tag "${IMAGE}:edge" "${IMAGE}@${DIGEST}"
